; Mosaic one-container supervisor: Go bridge + Python brain on /data.
; Railway/Docker run supervisord as PID 1; both processes share /data.
; Secrets arrive via env (MOSAIC_BRIDGE_TOKEN, GEMINI_API_KEY, ...), never files.

[supervisord]
nodaemon = true
logfile = /data/supervisord.log
pidfile = /data/supervisord.pid

[program:bridge]
command = /app/components/wa_bridge/wa-bridge
directory = /app
autostart = true
autorestart = true
stdout_logfile = /data/bridge.log
stderr_logfile = /data/bridge.log
environment =
    STORE_DIR="/data",
    BRIDGE_INTERNAL_PORT="8081"

[program:brain]
command = python3 -m hermes_bot.brain
directory = /app
autostart = true
autorestart = true
stdout_logfile = /data/brain.log
stderr_logfile = /data/brain.log
environment =
    STORE_DIR="/data",
    BRAIN_PORT="7000"
