<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mosaic Setup</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: #0d1117; color: #c9d1d9; min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
}
.container { width: 100%; max-width: 420px; padding: 24px; }
.card {
  background: #161b22; border: 1px solid #30363d; border-radius: 12px;
  padding: 32px; text-align: center;
}
h1 { font-size: 24px; color: #58a6ff; margin-bottom: 16px; }
input[type=password] {
  width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #30363d;
  background: #0d1117; color: #c9d1d9; font-size: 16px; margin-bottom: 12px;
  outline: none;
}
input:focus { border-color: #58a6ff; }
.btn {
  width: 100%; padding: 12px; border-radius: 8px; border: none;
  font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 8px;
}
.btn-primary { background: #238636; color: #fff; }
.btn-danger { background: #da3633; color: #fff; }
.alert { padding: 10px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; }
.alert-error { background: #490202; color: #f85149; }
.hidden { display: none !important; }
.status { font-size: 15px; margin-bottom: 12px; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
.dot-on { background: #3fb950; }
.dot-off { background: #f85149; }
.qr-img { max-width: 100%; border-radius: 8px; margin: 12px 0; }
.tick { font-size: 15px; margin-top: 12px; color: #3fb950; }
.tick-missing { color: #f85149; }
#line, #connected-line { font-size: 15px; margin-bottom: 20px; }
</style>
</head>
<body>
<div class="container">

  <div id="screen-set-password" class="card hidden">
    <h1>Mosaic</h1>
    <input type="password" id="set-pw-input" placeholder="Choose a password (min 6 chars)">
    <div id="set-pw-error" class="alert alert-error hidden"></div>
    <button class="btn btn-primary" onclick="doSetPassword()">Set Password</button>
  </div>

  <div id="screen-login" class="card hidden">
    <h1>Mosaic</h1>
    <input type="password" id="login-password" placeholder="Password">
    <div id="login-error" class="alert alert-error hidden"></div>
    <button class="btn btn-primary" onclick="doLogin()">Enter</button>
  </div>

  <div id="view-setup" class="card hidden">
    <h1>Mosaic</h1>
    <div id="bridge-status" class="status"><span class="dot dot-off"></span>Bridge: checking…</div>
    <img id="qr-img" class="qr-img hidden" src="" alt="Scan with WhatsApp">
    <div id="gemini-tick" class="tick">Gemini key: checking…</div>
  </div>

  <div id="view-connected" class="card hidden">
    <h1>Mosaic</h1>
    <p id="connected-line">Connected</p>
    <button id="unlink-btn" class="btn btn-danger" onclick="doUnlink()">Unlink</button>
  </div>

</div>

<script>
function api(path, method, body) {
  return fetch(path, {
    method: method || 'GET',
    headers: {'Content-Type': 'application/json', 'Cache-Control': 'no-cache'},
    credentials: 'same-origin',
    body: body ? JSON.stringify(body) : undefined
  }).then(r => r.json());
}

function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden'); }

function doSetPassword() {
  var pw = document.getElementById('set-pw-input').value;
  var err = document.getElementById('set-pw-error');
  err.classList.add('hidden');
  api('/setup/set-password', 'POST', {password: pw}).then(function(data) {
    if (data.ok) { hide('screen-set-password'); show('view-setup'); pollState(); }
    else { err.textContent = data.error || 'Failed'; err.classList.remove('hidden'); }
  });
}

function doLogin() {
  var pw = document.getElementById('login-password').value;
  var err = document.getElementById('login-error');
  err.classList.add('hidden');
  api('/setup/login', 'POST', {password: pw}).then(function(data) {
    if (data.ok) { hide('screen-login'); show('view-setup'); pollState(); }
    else { err.textContent = data.error || 'Invalid'; err.classList.remove('hidden'); }
  });
}

function doUnlink() {
  var btn = document.getElementById('unlink-btn');
  btn.disabled = true; btn.textContent = 'Unlinking…';
  api('/setup/reset', 'POST', {confirm: 'RESET', keep_key: true}).then(function() {
    document.body.innerHTML = '<div class="container"><div class="card"><h1>Mosaic</h1><p>Unlinked. The bridge is restarting.</p></div></div>';
  }).catch(function() { btn.disabled = false; btn.textContent = 'Unlink'; });
}

function agoMinutes(iso) {
  if (!iso) return 'n/a';
  var mins = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  return mins + ' min';
}

function pollState() {
  api('/setup/state').then(function(data) {
    if (data.state === 'READY') {
      hide('view-setup'); show('view-connected');
      document.getElementById('connected-line').textContent =
        'Connected as +' + (data.own_phone || '?') + ' · last message ' + agoMinutes(data.last_message_at) + ' ago';
      return;
    }
    hide('view-connected'); show('view-setup');
    var on = !!data.connected;
    document.getElementById('bridge-status').innerHTML =
      '<span class="dot ' + (on ? 'dot-on' : 'dot-off') + '"></span>Bridge: ' + (on ? 'connected' : 'waiting for link…');
    var qr = document.getElementById('qr-img');
    if (data.qr_data_url) { qr.src = data.qr_data_url; qr.classList.remove('hidden'); }
    else { qr.classList.add('hidden'); }
    var tick = document.getElementById('gemini-tick');
    if (data.gemini_key_set) {
      tick.textContent = 'Gemini key: valid ✓';
      tick.classList.remove('tick-missing');
    } else {
      tick.textContent = 'Gemini key: missing — set it via env';
      tick.classList.add('tick-missing');
    }
  }).catch(function() {});
}

fetch('/setup/info').then(function(r) { return r.json(); }).then(function(data) {
  if (data.password_set) { show('screen-login'); }
  else { show('screen-set-password'); }
  pollState();
}).catch(function() { show('screen-login'); });

setInterval(pollState, 2000);

document.getElementById('login-password').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('set-pw-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doSetPassword();
});
</script>
</body>
</html>
